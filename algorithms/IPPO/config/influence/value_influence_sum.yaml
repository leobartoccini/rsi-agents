# @package _global_
# Social-influence intrinsic reward (Jaques et al., 2019), feedforward MOA-free,
# WELFARE-AWARE variant: r = I + delta_v -- the KL-based influence magnitude I is
# added to delta_v, how much agent k's REAL action raised or lowered agent j's value
# relative to what k's own real policy would have produced on average. Same
# independent-policy counterfactual mechanism as enabled_independent.yaml (real
# env.step resimulation, no LSTM, no MOA network). See value_influence_mult.yaml for
# the r = I * delta_v product form and value_influence_diff.yaml for the
# reciprocal-influence difference form.
PARAMETER_SHARING: False
INFLUENCE_REWARD: True
VALUE_INFLUENCE_SUM: True
INFLUENCE_WEIGHT: 0.224   # paper's Table 3 Cleanup-MOA value, starting point for tuning
# Influence needs distinguishable per-agent rewards -- the shared/common-reward path
# never reaches the branch that produces them. Set this directly here rather than
# changing the file's default `reward` group, so non-influence runs are unaffected.
ENV_KWARGS:
  shared_rewards: False
REWARD: individual
WANDB_TAGS:
  - VALUE_INFLUENCE_SUM
