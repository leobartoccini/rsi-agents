# @package _global_
# Same mechanism as enabled_lstm.yaml (ActorCriticLSTM, main policy/value pathway
# conditions directly on the other agent's previous action, no auxiliary loss), but
# the intrinsic reward is delta_v ALONE: r = delta_v -- no KL-based influence term I
# at all, unlike value_influence_sum_lstm.yaml (r = I + lambda*delta_v). delta_v is
# how much agent k's action raised or lowered agent j's value relative to what k's
# own real policy would have produced on average. LSTM_INFLUENCE-only -- this mode
# isn't implemented in the feedforward (non-LSTM) path.
PARAMETER_SHARING: False
INFLUENCE_REWARD: True
LSTM_INFLUENCE: True
VALUE_INFLUENCE_VALUE: True
LSTM_HIDDEN_DIM: 128
# NUM_MINIBATCHES must divide NUM_ENVS here (minibatching permutes the actor axis only,
# keeping each minibatch's full time sequence intact for BPTT) -- NOT NUM_STEPS*NUM_ENVS
# like the feedforward path. The base default of 500 is invalid once NUM_ENVS is small.
NUM_MINIBATCHES: 8
# Full backprop-through-time over NUM_STEPS sequential CNN+LSTM steps is memory-heavy;
# start shorter than the feedforward path's default of 1000 and raise if it fits.
NUM_STEPS: 256
INFLUENCE_WEIGHT: 0.62
ENV_KWARGS:
  shared_rewards: False
REWARD: individual
WANDB_TAGS:
  - VALUE_LSTM
