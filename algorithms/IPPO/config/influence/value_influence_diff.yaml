# @package _global_
# Social-influence intrinsic reward (Jaques et al., 2019), feedforward MOA-free,
# RECIPROCAL-INFLUENCE variant: r = I + (delta_v_(k->j) - delta_v_(j->k)) -- agent k's
# reward adds the KL-based influence magnitude I to the NET value effect between k and
# j: how much k's real action changed j's value, minus how much j's real action (from
# j's own counterfactual) changed k's value back. Rewards agents for influencing
# others' value more than those others influence theirs, rather than just the
# one-directional delta_v used by value_influence_mult.yaml / value_influence_sum.yaml.
# Same independent-policy counterfactual mechanism as enabled_independent.yaml (real
# env.step resimulation, no LSTM, no MOA network).
PARAMETER_SHARING: False
INFLUENCE_REWARD: True
VALUE_INFLUENCE_DIFF: True
INFLUENCE_WEIGHT: 0.224   # paper's Table 3 Cleanup-MOA value, starting point for tuning
# Influence needs distinguishable per-agent rewards -- the shared/common-reward path
# never reaches the branch that produces them. Set this directly here rather than
# changing the file's default `reward` group, so non-influence runs are unaffected.
ENV_KWARGS:
  shared_rewards: False
REWARD: individual
WANDB_TAGS:
  - VALUE_INFLUENCE_DIFF
