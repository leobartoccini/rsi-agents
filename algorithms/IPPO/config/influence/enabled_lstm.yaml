# @package _global_
# Social-influence intrinsic reward via ActorCriticLSTM -- unlike enabled_recurrent.yaml
# (a separate MOA auxiliary head), here the MAIN policy/value pathway itself conditions
# directly on the other agent's previous action. No auxiliary loss: the network learns
# to use that input entirely through the ordinary PPO actor/critic gradient. The real
# conditional for the influence reward is just the policy's normal output; the
# counterfactual is the SAME network re-called with a hypothetical previous action --
# no env.step resimulation needed either.
PARAMETER_SHARING: False
INFLUENCE_REWARD: True
LSTM_INFLUENCE: True
LSTM_HIDDEN_DIM: 128
# NUM_MINIBATCHES must divide NUM_ENVS here (minibatching permutes the actor axis only,
# keeping each minibatch's full time sequence intact for BPTT) -- NOT NUM_STEPS*NUM_ENVS
# like the feedforward path. The base default of 500 is invalid once NUM_ENVS is small.
NUM_MINIBATCHES: 8
# Full backprop-through-time over NUM_STEPS sequential CNN+LSTM steps is memory-heavy;
# start shorter than the feedforward path's default of 1000 and raise if it fits.
NUM_STEPS: 256
INFLUENCE_WEIGHT: 0.62
ENV_KWARGS:
  shared_rewards: False
REWARD: individual
WANDB_TAGS:
  - INFLUENCE_LSTM
