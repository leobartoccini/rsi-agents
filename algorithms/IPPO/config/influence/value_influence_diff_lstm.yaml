# @package _global_
# Same mechanism as enabled_lstm.yaml (ActorCriticLSTM, main policy/value pathway
# conditions directly on the other agent's previous action, no auxiliary loss), but
# the influence reward is RECIPROCAL: r = I + lambda*(delta_v_(k->j) - delta_v_(j->k))
# -- agent k's reward adds the KL-based influence magnitude I to the NET value effect
# between k and j (scaled by VALUE_INFLUENCE_LAMBDA): how much k's action changed j's
# value, minus how much j's action changed k's value back. See
# value_influence_diff.yaml for the feedforward (non-LSTM) version of this same
# combination.
PARAMETER_SHARING: False
INFLUENCE_REWARD: True
LSTM_INFLUENCE: True
VALUE_INFLUENCE_DIFF: True
# Weight on the net delta_v term itself, independent of INFLUENCE_WEIGHT/beta (which
# scales the WHOLE I + lambda*net_delta_v term once added to reward) -- override on
# CLI, e.g. VALUE_INFLUENCE_LAMBDA=0.5.
VALUE_INFLUENCE_LAMBDA: 1.0
LSTM_HIDDEN_DIM: 128
# NUM_MINIBATCHES must divide NUM_ENVS here (minibatching permutes the actor axis only,
# keeping each minibatch's full time sequence intact for BPTT) -- NOT NUM_STEPS*NUM_ENVS
# like the feedforward path. The base default of 500 is invalid once NUM_ENVS is small.
NUM_MINIBATCHES: 8
# Full backprop-through-time over NUM_STEPS sequential CNN+LSTM steps is memory-heavy;
# start shorter than the feedforward path's default of 1000 and raise if it fits.
NUM_STEPS: 256
INFLUENCE_WEIGHT: 0.62
ENV_KWARGS:
  shared_rewards: False
REWARD: individual
WANDB_TAGS:
  - VALUE_INFLUENCE_DIFF_LSTM
